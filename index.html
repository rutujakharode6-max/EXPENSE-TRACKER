<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pastel Watercolor Expense Tracker</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Phosphor Icons for soft styled icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header class="main-header">
            <div class="logo">
                <i class="ph-fill ph-drop watercolor-icon"></i>
                <h1>Pastel Tracker</h1>
            </div>
            <div class="budget-section">
                <div class="budget-info">
                    <span class="label">Monthly Budget</span>
                    <span class="amount" id="budget-amount">$1,000.00</span>
                </div>
                <div class="progress-container">
                    <div class="progress-bar" id="budget-progress"></div>
                </div>
                <button id="set-budget-btn" class="glass-btn">Set Budget</button>
            </div>
        </header>

        <main class="dashboard-grid">
            <!-- Left Column: Form and List -->
            <div class="left-col">
                <!-- Add Expense Form -->
                <section class="glass-card form-section">
                    <h2><i class="ph ph-plus-circle"></i> Add Expense</h2>
                    <form id="expense-form">
                        <div class="input-group">
                            <label for="desc">Description</label>
                            <input type="text" id="desc" placeholder="E.g. Groceries" required>
                        </div>
                        <div class="input-group">
                            <label for="amount">Amount</label>
                            <input type="number" id="amount" placeholder="0.00" step="0.01" required>
                        </div>
                        <div class="input-group">
                            <label for="category">Category</label>
                            <div class="custom-select">
                                <select id="category" required>
                                    <option value="" disabled selected>Select category</option>
                                    <option value="Food">Food</option>
                                    <option value="Transport">Transport</option>
                                    <option value="Shopping">Shopping</option>
                                    <option value="Utilities">Utilities</option>
                                    <option value="Entertainment">Entertainment</option>
                                    <option value="Other">Other</option>
                                </select>
                            </div>
                        </div>
                        <div class="input-group">
                            <label for="date">Date</label>
                            <input type="date" id="date" required>
                        </div>
                        <button type="submit" class="submit-btn">Add Expense</button>
                    </form>
                </section>

                <!-- Recent Expenses List -->
                <section class="glass-card list-section">
                    <div class="list-header">
                        <h2><i class="ph ph-list-dashes"></i> Recent Expenses</h2>
                        <span class="total-spent" id="total-spent">Total: $0.00</span>
                    </div>
                    <div class="expense-list-container">
                        <ul id="expense-list" class="expense-list">
                            <!-- Items inserted by JS -->
                        </ul>
                    </div>
                </section>
            </div>

            <!-- Right Column: Charts -->
            <div class="right-col">
                <section class="glass-card chart-section">
                    <h2><i class="ph ph-trend-up"></i> Expense Trends</h2>
                    <div class="chart-container">
                        <canvas id="lineChart"></canvas>
                    </div>
                </section>

                <section class="glass-card chart-section">
                    <h2><i class="ph ph-chart-pie-slice"></i> Category Breakdown</h2>
                    <div class="chart-container">
                        <canvas id="barChart"></canvas>
                    </div>
                </section>
            </div>
        </main>
    </div>

    <!-- Budget Modal -->
    <div id="budget-modal" class="modal-overlay hidden">
        <div class="glass-card modal-content">
            <h2>Set Monthly Budget</h2>
            <div class="input-group">
                <input type="number" id="new-budget" placeholder="Enter amount" step="10">
            </div>
            <div class="modal-actions">
                <button id="cancel-budget" class="glass-btn">Cancel</button>
                <button id="save-budget" class="submit-btn">Save</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
